name: pages

# The pages at https://ezexe.github.io/p4/: the files under docs/, published as they are, so docs/index.html is the
# site's first page. Needs Settings → Pages → Source: GitHub Actions.

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

# Two jobs, as the README of actions/deploy-pages has it: "We recommend this action to be used in a dedicated job",
# one that waits for the job that uploads. With both steps in one job the deployment twice found no artifact a second
# after the upload, "Fetching artifact metadata failed", in run 44600625954 and in run 45001509249.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
