name: tests

# A second read of every push to main and of every pull request, on a machine that is not ezexe's: every test of the
# repository under pytest, and Claude Code's own checks of the catalog and the three plugins.
# It holds no secret and asks for no token beyond a read of the checkout.

on:
  pull_request:
  push:
    branches: [main]
  # The plugins job installs the newest Claude Code each time, so a new build can turn main red with no push to show
  # it. One run a day, on main as it stands, shows it within the day, and GitHub writes to whoever last changed this
  # schedule when that run fails.
  schedule:
    - cron: "17 5 * * *"
  # The release workflow runs these jobs before it tags a plugin's version.
  workflow_call:

permissions:
  contents: read

# Called by the release workflow, github.workflow is that workflow's name, so its run of these jobs waits on no run
# of this workflow and is cancelled by none. The daily run has a group of its own, so it waits on no push's run and
# takes the place of none that waits.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'schedule' && 'schedule' || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pytest:
    # The systems Claude Code runs the plugins on. On Windows the hook runners are sh scripts that run under Git Bash,
    # and four skip marks of p4-phi's tests let their tests run only there.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    # Each command of this job runs in lbiza/, where pyproject.toml names the test tools and pytest's settings and
    # tests/ holds the tests.
    defaults:
      run:
        working-directory: lbiza
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install the test tools
        run: python -m pip install --group dev
      - name: Run the tests
        # On Windows, Git Bash runs the command, as a session's Bash tool does, so one Git Bash lives through the run.
        # Git for Windows maps /tmp for every sh from the temp folder of the first one alive, and with none alive a
        # hook's sh can find /tmp in a temp folder a test has since removed, and warn of it on stderr.
        shell: bash
        run: python -m pytest

  plugins:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Install Claude Code
        run: |
          npm install -g @anthropic-ai/claude-code@latest
          claude --version
      - name: Validate the catalog
        run: claude plugin validate . --strict
      - name: Validate p4-phi
        if: ${{ !cancelled() }}
        run: claude plugin validate lbiza/plugins/p4-phi --strict
      - name: Validate p4-temportal
        if: ${{ !cancelled() }}
        run: claude plugin validate lbiza/plugins/p4-temportal --strict
      - name: Validate p4-native
        if: ${{ !cancelled() }}
        run: claude plugin validate lbiza/plugins/p4-native --strict
      - name: Test p4-phi's hooks module
        if: ${{ !cancelled() }}
        run: claude plugin test lbiza/plugins/p4-phi
      - name: Test p4-temportal's hooks module
        if: ${{ !cancelled() }}
        run: claude plugin test lbiza/plugins/p4-temportal
      - name: Test p4-native's hooks module
        if: ${{ !cancelled() }}
        run: claude plugin test lbiza/plugins/p4-native
